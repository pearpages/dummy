name: xray

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  xray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false # the bundle build runs PR code
      - uses: pearpages/xray@v0
        with:
          bundle: "true"
